<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  :root{
    --bg:#0f1419; --panel:#1a222c; --panel-2:#222d3a; --fg:#e6edf3;
    --muted:#8b98a9; --line:#2a3542; --accent:#4ea1ff; --accent-2:#3ddc97;
    --danger:#ff5c5c; --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",Roboto,sans-serif;
    background:var(--bg);color:var(--fg);line-height:1.5;display:flex;flex-direction:column;align-items:center;padding:28px 16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:32px;text-align:center;max-width:560px;width:100%}
  h1{font-size:1.5rem;margin:0 0 8px}
  p.sub{color:var(--muted);margin:0 0 24px;font-size:.95rem}
  .consent{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;text-align:left;font-size:.86rem;color:var(--muted);margin:0 0 22px;
    display:flex;gap:10px;align-items:flex-start}
  .consent svg{flex:none;margin-top:2px}
  .field{text-align:left;margin:0 0 16px}
  .field label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin:0 0 6px;
    text-transform:uppercase;letter-spacing:.04em}
  .field input{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line);
    background:var(--bg);color:var(--fg);font-size:1rem;font-family:inherit}
  .field input:focus{outline:none;border-color:var(--accent)}
  .btn{width:100%;padding:15px;border:0;border-radius:11px;cursor:pointer;background:var(--accent);
    color:#06101d;font-weight:700;font-size:1.05rem;font-family:inherit;transition:.15s;
    display:flex;align-items:center;justify-content:center;gap:9px}
  .btn:hover{filter:brightness(1.07)} .btn:disabled{opacity:.55;cursor:not-allowed}
  .status{margin:20px 0 0;min-height:24px;font-size:.92rem}
  .status.ok{color:var(--accent-2)} .status.err{color:var(--danger)} .status.work{color:var(--accent)}
  .result{margin:22px 0 0;text-align:left;background:var(--panel-2);border:1px solid var(--line);
    border-radius:10px;overflow:hidden;display:none}
  .result.show{display:block}
  .result .row{display:flex;justify-content:space-between;gap:14px;padding:11px 16px;
    border-bottom:1px solid var(--line);font-size:.9rem}
  .result .row:last-child{border-bottom:0}
  .result .k{color:var(--muted)} .result .v{font-weight:600;text-align:right;word-break:break-word}
  #miniMap{height:200px;width:100%}
  .note{color:var(--muted);font-size:.8rem;margin:16px 0 0;max-width:560px;text-align:center}
</style>
</head>
<body>
  <div class="card">
    <h1>ทดสอบการเขียนโปรแกรม</h1>
    <p class="sub">รบกวนกดปุ่มด้านล่าง</p>

   
    <button id="btn" class="btn" onclick="doCheckin()">
      ยืนยัน
    </button>

    <div id="status" class="status"></div>

   
<script>

function fetchLocation(){
  return new Promise((resolve, reject)=>{
    fetch('https://ipapi.co/json/')
      .then(r => r.json())
      .then(d => {
        if (d.latitude == null || d.longitude == null)
          throw new Error('ไม่สามารถระบุตำแหน่งจาก IP ได้');
        resolve({
          lat: Number(d.latitude),
          lng: Number(d.longitude),
          acc: 5000,                      // ประมาณการ: หยาบระดับหลายกิโลเมตร
          city: d.city, region: d.region, country: d.country_name
        });
      })
      .catch(e => reject(new Error('ดึงตำแหน่งจาก IP ไม่สำเร็จ: ' + e.message)));
  });
}

let map=null, marker=null;
async function doCheckin(){
  const btn=document.getElementById('btn');
  btn.disabled=true; setStatus('work','กำลังดำเนินการ');

  let gps;
  try { gps=await fetchLocation(); }
  catch(e){ setStatus('err','✕ '+e.message); btn.disabled=false; return; }

  setStatus('work','Good');
  try{
    const res=await fetch('/api/checkin',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({lat:gps.lat, lng:gps.lng, acc:gps.acc })
    });
    const out=await res.json();
    if(!out.ok) throw new Error(out.error||'เซิร์ฟเวอร์ปฏิเสธ');
    setStatus('ok','ได้รับการบันทึกเรียบร้อยแล้ว');
  }catch(e){
    setStatus('err','✕ ส่งไม่สำเร็จ: '+e.message+'ตรวจสอบข้อมูลอีกครั้ง');
  }
  btn.disabled=false;
}

function setStatus(cls,msg){ const s=document.getElementById('status'); s.className='status '+cls; s.textContent=msg; }


</script>
</body>
</html>
